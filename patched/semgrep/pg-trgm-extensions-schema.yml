rules:
  - id: pg-trgm-must-be-in-extensions-schema
    pattern-regex: 'CREATE EXTENSION (IF NOT EXISTS )?pg_trgm(?! WITH SCHEMA)'
    paths:
      include:
        - hindsight-api-slim/hindsight_api/alembic/versions/
    message: >
      CREATE EXTENSION pg_trgm должен быть с явным WITH SCHEMA extensions
      (per sup ADR-019 schema-isolation: public stays empty, extensions live
      in `extensions` schema — canonical Supabase pattern, same as pg_cron /
      pg_net / pgcrypto / uuid-ossp). Без явного schema clause extension
      создаётся в первой writable schema из search_path; для tenant migrations
      (SupTenantExtension с search_path = "<tenant_schema>", public) это
      приводит к установке в tenant schema. Worker pool connections используют
      default postgres search_path ("$user", public, extensions) — без
      extensions / public placement оператор % невиден, batch_retain падает
      с "operator does not exist: text % text". Patched 2026-05-16 в
      c1a2b3d4e5f6 (с WITH SCHEMA extensions, after ADR-019 refactor 2026-06-01),
      corrective migrations 9c8f3a2d1b4e_move_pg_trgm_to_public (legacy, kept
      for chain compatibility) and e5d4c3b2a1f0_move_pg_trgm_to_extensions_per_adr019.
    languages: [python]
    severity: ERROR
    metadata:
      category: correctness
      technology:
        - python
        - postgresql
        - hindsight
        - supabase
      references:
        - umbrella-sup/sup/.planning/adrs/ADR-019-schema-isolation.md
